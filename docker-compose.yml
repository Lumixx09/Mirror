version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mirror-postgres
    restart: always
    environment:
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror_pass
      POSTGRES_DB: mirror_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mirror-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
